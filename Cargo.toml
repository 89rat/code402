[workspace]
resolver = "2"
members = ["crates/core", "crates/edge"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# DECISION: alloy-primitives "serde" feature enabled — required for the
# Serialize/Deserialize derives on TransferWithAuthorization/PaymentVoucher
# (Address/U256/B256 serde impls are feature-gated). No dependency added.
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types  = "0.8"
k256             = { version = "0.13", features = ["ecdsa"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
thiserror        = "1"
