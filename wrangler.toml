name = "code402-edge"
main = "crates/edge/build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
# worker-build must stay at ^0.1 to match worker = "0.4" (see CHANGELOG).
command = "cd crates/edge && worker-build --release"

# Human storefront: static SPA served from site/dist. API + machine manifests
# stay dynamic in the worker (x402.json is rendered per-environment — the stale
# static copy in dist must never shadow it).
[assets]
directory = "./site/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/v2/*", "/.well-known/*", "/llms.txt"]

# ---- bindings (internal truth; names are contract) ----
[[kv_namespaces]]
binding = "PRICING"
id = "6142cbbc58dc4867b45078963f987e9b"            # code402-PRICING-staging

[[d1_databases]]
binding = "LEDGER"
database_name = "code402-ledger-staging"
database_id = "3dba6344-88c1-4254-94f7-58823740466e"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "code402-receipts-staging"

[durable_objects]
bindings = [
  { name = "NONCE_GUARD", class_name = "NonceGuard" },
  { name = "SETTLEMENT_CLAIM", class_name = "SettlementClaim" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NonceGuard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SettlementClaim"]

[[queues.producers]]
binding = "SETTLEMENT_CONFIRM"
queue = "settlement-confirm"

[[queues.consumers]]
queue = "settlement-confirm"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5

[triggers]
crons = ["0 * * * *", "0 2 * * *"]

# staging = Base Sepolia. Secrets via `wrangler secret put` (never in files):
#   COMPANY_WALLET, RECEIPT_SIGNING_KEY, RPC_PRIMARY, RPC_FALLBACK
[vars]
CHAIN_ID = "84532"
USDC_BASE = "0x036CbD53842c5426634e7929541eC2318f3dCF7e" # USDC on Base Sepolia
TOKEN_NAME = "USDC"  # on-chain name() — differs from mainnet "USD Coin"!
TOKEN_VERSION = "2"
RECEIPT_SIGNER_ADDRESS = "0x7b885c42b47671a91b3d81694ce18d38e25e7149"

# ---- production = Base mainnet ----
# Separate worker name so production never clobbers the staging script.
[env.production]
name = "code402-edge-prod"

# Custom domain (zone code402.dev already in account). Also fixes same-account
# workers.dev subrequest routing (asset-router interception observed 2026-08-17).
routes = [
  { pattern = "code402.dev", custom_domain = true },
  { pattern = "www.code402.dev", custom_domain = true }
]

[env.production.durable_objects]
bindings = [
  { name = "NONCE_GUARD", class_name = "NonceGuard" },
  { name = "SETTLEMENT_CLAIM", class_name = "SettlementClaim" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["NonceGuard"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["SettlementClaim"]

[env.production.triggers]
crons = ["0 * * * *", "0 2 * * *"]

[[env.production.kv_namespaces]]
binding = "PRICING"
id = "e5a48e9490df47a087820a550f758034"            # code402-edge-prod/PRICING

[[env.production.d1_databases]]
binding = "LEDGER"
database_name = "code402-ledger-prod"
database_id = "b5663f5e-b773-4fe9-84c4-ba1b41c0d859"

[[env.production.r2_buckets]]
binding = "RECEIPTS"
bucket_name = "code402-receipts-prod"

[[env.production.queues.producers]]
binding = "SETTLEMENT_CONFIRM"
queue = "settlement-confirm-prod"

[[env.production.queues.consumers]]
queue = "settlement-confirm-prod"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5

[env.production.vars]
CHAIN_ID = "8453"
USDC_BASE = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" # USDC on Base mainnet
TOKEN_NAME = "USD Coin"
TOKEN_VERSION = "2"
RECEIPT_SIGNER_ADDRESS = "0x12138883e159622e22abcdac0e1ecc4b5c0a072e"
