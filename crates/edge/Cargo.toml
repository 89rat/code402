[package]
name = "m2m-edge"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
m2m-core = { path = "../core" }
# workers-rs — version anchored 2026-08-12 (see CHANGELOG); build with
# worker-build, target wasm32-unknown-unknown.
worker = { version = "0.4", features = ["d1", "queue"] }
# required by the #[durable_object] macro expansion (worker-macros 0.4)
# Pinned ==0.2.105: must match the wasm-bindgen CLI that worker-build 0.1.x
# downloads (0.2.105). Schema mismatch breaks the edge build.
wasm-bindgen = "=0.2.105"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1"
alloy-primitives.workspace = true
k256.workspace = true
serde.workspace = true
serde_json.workspace = true
# DECISION: unify getrandom (transitive via k256) onto its "js" feature so
# wasm32-unknown-unknown compiles. Feature-only change; no new dependency.
getrandom = { version = "0.2", features = ["js"] }
